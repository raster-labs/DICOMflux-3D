[package]
name = "dicomflux-3d"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Checked 2D 16-bit DICOM greyscale presentation and f64 patient LPS spatial geometry foundation (FS-01)"
license = "MIT"
publish = false
autobins = false

[workspace]
members = ["."]
exclude = ["examples/independent-consumer"]
resolver = "2"

[dependencies]
sha2 = "0.11"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "dx12"] }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "generate_evidence"
path = "examples/generate_evidence.rs"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = "deny"
